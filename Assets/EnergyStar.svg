<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD13B"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <filter id="whiteGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Golden Amber Star -->
  <path fill="url(#starGrad)" stroke="#E08600" stroke-width="2.5" d="M128 15 157 91l82 4-63 52 21 80-69-44-69 44 21-80-63-52 82-4z"/>
  <!-- Scaled Glowing White Flash Lightning Bolt (contained inside star) -->
  <polygon fill="#FFFFFF" filter="url(#whiteGlow)" stroke="#FFFFFF" stroke-width="1.2" points="132,86 99,138 120,138 112,174 149,122 127,122 139,86"/>
</svg>
